<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Guru | Lensa Psikologi</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
    }

    .wrap {
      width: min(760px, calc(100% - 32px));
      margin: 40px auto;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
    }

    h1, h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 700;
    }

    input, textarea, select, button {
      width: 100%;
      font: inherit;
    }

    input, textarea, select {
      border: 1px solid #d7dce5;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 16px;
      background: #4f46e5;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #eef0ff;
      color: #3730a3;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .check-row input {
      width: auto;
    }

    #teacherPanel {
      display: none;
    }

    #message {
      padding: 12px;
      border-radius: 10px;
      background: #eef2f7;
      min-height: 44px;
      white-space: pre-wrap;
    }

    .note {
      color: #667085;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <h1>Lensa Psikologi — Portal Guru</h1>
      <p>Guru yang dibenarkan sahaja boleh mengurus modul dan episod.</p>
    </section>

    <section id="loginPanel" class="card">
      <h2>Log Masuk Guru</h2>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />

      <label for="password">Kata Laluan</label>
      <input id="password" type="password" autocomplete="current-password" />

      <button id="loginBtn" type="button">Log Masuk</button>
    </section>

    <section id="teacherPanel" class="card">
      <h2>Tambah Episod</h2>

      <button id="logoutBtn" class="secondary" type="button">Log Keluar</button>

      <form id="episodeForm">
        <label for="moduleId">Modul</label>
        <select id="moduleId" required>
          <option value="">Pilih modul</option>
        </select>

        <label for="title">Tajuk Episod</label>
        <input
          id="title"
          type="text"
          placeholder="Contoh: Episod 2: Memahami Punca Emosi"
          required
        />

        <label for="description">Penerangan</label>
        <textarea
          id="description"
          placeholder="Masukkan penerangan episod"
        ></textarea>

        <label for="order">Nombor / Susunan Episod</label>
        <input id="order" type="number" min="1" step="1" required />

        <label for="videoUrl">Video URL</label>
        <input id="videoUrl" type="url" placeholder="https://..." />

        <label for="slug">Slug</label>
        <input id="slug" type="text" placeholder="Contoh: memahami-punca-emosi" />
        <div class="note">Jika kosong, slug dijana automatik daripada tajuk.</div>

        <label class="check-row">
          <input id="published" type="checkbox" />
          Publish sekarang
        </label>

        <button id="saveBtn" type="submit">Simpan Episod</button>
      </form>
    </section>

    <div id="message">Sedia.</div>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


    // Firebase config projek Lensa Psikologi
    const firebaseConfig = {
      apiKey: "AIzaSyA3kKFsD8pkAG07ivnxMco5TQwOdVUEtOk",
      authDomain: "lensa-psikologi.firebaseapp.com",
      projectId: "lensa-psikologi",
      storageBucket: "lensa-psikologi.firebasestorage.app",
      messagingSenderId: "448051802326",
      appId: "1:448051802326:web:21250aba4339a9394d5977",
      measurementId: "G-81ZV2L61JH"
    };


    // WAJIB: gantikan dengan User UID guru sebenar.
    // Firebase Console > Authentication > Users > User UID
    const TEACHER_UID = "LAxskKd2hzXICje6Uh4nBj5zAlL2";


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginPanel = document.getElementById("loginPanel");
    const teacherPanel = document.getElementById("teacherPanel");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const episodeForm = document.getElementById("episodeForm");
    const moduleSelect = document.getElementById("moduleId");
    const saveBtn = document.getElementById("saveBtn");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
    }

    function makeSlug(text) {
      return text
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    loginBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Masukkan email dan kata laluan.");
        return;
      }

      loginBtn.disabled = true;
      showMessage("Sedang log masuk...");

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);

        if (result.user.uid !== TEACHER_UID) {
          await signOut(auth);
          throw new Error("Akaun ini bukan akaun guru yang dibenarkan.");
        }

        showMessage("Log masuk guru berjaya.");
      } catch (error) {
        console.error(error);
        showMessage("Log masuk gagal: " + error.message);
      } finally {
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        showMessage("Anda telah log keluar.");
      } catch (error) {
        console.error(error);
        showMessage("Gagal log keluar: " + error.message);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user && user.uid === TEACHER_UID) {
        loginPanel.style.display = "none";
        teacherPanel.style.display = "block";

        try {
          await loadModules();
        } catch (error) {
          console.error(error);
          showMessage("Gagal memuatkan modul: " + error.message);
        }
      } else {
        loginPanel.style.display = "block";
        teacherPanel.style.display = "none";
      }
    });

    async function loadModules() {
      moduleSelect.innerHTML = '<option value="">Pilih modul</option>';

      const snapshot = await getDocs(collection(db, "modules"));
      const modules = [];

      snapshot.forEach((doc) => {
        modules.push({
          id: doc.id,
          ...doc.data()
        });
      });

      modules.sort((a, b) => (a.order || 0) - (b.order || 0));

      modules.forEach((module) => {
        const option = document.createElement("option");
        option.value = module.id;
        option.textContent = module.title || module.id;
        moduleSelect.appendChild(option);
      });

      if (modules.length === 0) {
        showMessage('Tiada modul dijumpai dalam collection "modules".');
      } else {
        showMessage("Modul berjaya dimuatkan.");
      }
    }

    episodeForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const user = auth.currentUser;

      if (!user || user.uid !== TEACHER_UID) {
        showMessage("Akses ditolak. Sila log masuk sebagai guru.");
        return;
      }

      const title = document.getElementById("title").value.trim();
      const customSlug = document.getElementById("slug").value.trim();

      const data = {
        moduleId: moduleSelect.value,
        title,
        description: document.getElementById("description").value.trim(),
        order: Number(document.getElementById("order").value),
        videoUrl: document.getElementById("videoUrl").value.trim(),
        slug: customSlug || makeSlug(title),
        published: document.getElementById("published").checked,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };

      if (!data.moduleId || !data.title || !Number.isInteger(data.order) || data.order < 1) {
        showMessage("Sila lengkapkan Modul, Tajuk dan Nombor Episod.");
        return;
      }

      saveBtn.disabled = true;
      showMessage("Sedang menyimpan episod...");

      try {
        const ref = await addDoc(collection(db, "episodes"), data);
        episodeForm.reset();
        showMessage("Episod berjaya disimpan. Document ID: " + ref.id);
      } catch (error) {
        console.error(error);
        showMessage("Gagal menyimpan episod: " + error.message);
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
